### ============================================================
### General settings
### ============================================================

# Use the default shell as the command run in new panes/windows
set -g default-command "${SHELL}"

# Set prefix key to Ctrl+A (instead of default Ctrl+B)
set -g prefix ^A

# Start window numbering at 1 instead of 0
set -g base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Use vi-style keybindings in copy mode
setw -g mode-keys vi

# Keep session alive when a pane/window is destroyed
set -g detach-on-destroy off

# Place the status bar at the bottom of the screen
set-option -g status-position bottom

# Increase scrollback buffer size (default is only 2000 lines)
set -g history-limit 10000

# Remove delay after pressing Esc (avoids input lag in vim/neovim)
set -sg escape-time 0

# Enable focus events so terminal apps (e.g. vim/neovim) know when a pane gains/loses focus
set -g focus-events on


### ============================================================
### Pane splitting
### ============================================================

# Split window vertically (new pane below), keeping current path
bind-key '"' split-window -c "#{pane_current_path}"

# Split window horizontally (new pane to the side), keeping current path
bind-key % split-window -h -c "#{pane_current_path}"

# Toggle synchronized input across all panes in the window
bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"


### ============================================================
### Pane navigation (vi-style movement)
### ============================================================

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


### ============================================================
### Pane resizing
### ============================================================

bind-key C-h resize-pane -L 5
bind-key C-k resize-pane -U 5
bind-key C-j resize-pane -D 5
bind-key C-l resize-pane -R 5


### ============================================================
### Plugins (TPM - Tmux Plugin Manager)
### ============================================================

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'


### ============================================================
### Theme - Catppuccin
### ============================================================

# Catppuccin color flavour
set -g @catppuccin_flavour 'macchiato'

# Rounded style for window status segments
set -g @catppuccin_window_status_style "rounded"

# Window status text (shown for both current and other windows)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"


### ============================================================
### Status bar
### ============================================================

# Status bar left side (disabled/empty)
set -g status-left-length 100
set -g status-left ""

# Status bar right side: show current session info via Catppuccin
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_session}"


### ============================================================
### Initialize TPM (must be at the very bottom of the file)
### ============================================================

run '~/.tmux/plugins/tpm/tpm'